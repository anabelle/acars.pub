<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self';
                   script-src 'self' blob:;
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.cartocdn.com;
                   font-src 'self' https://fonts.gstatic.com https://*.cartocdn.com;
                   img-src 'self' data: blob: https://*.cartocdn.com https://*.basemaps.cartocdn.com https://blossom.primal.net https://*.blossom.band https://r2a.primal.net https://media.primal.net;
                   connect-src 'self' wss: https://*.cartocdn.com https://*.basemaps.cartocdn.com https://blossom.primal.net https://*.blossom.band;
                   worker-src 'self' blob:;" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Installable app (S34): manifest + icons rendered by scripts/render-app-icons.mjs. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACARS — Run a real airline on the real clock</title>
  <meta name="description"
    content="A free, open-source airline tycoon on a live world map. Real routes, real flight times, rival airlines. No ads, no pay-to-win." />
  <meta name="theme-color" content="#050a14" />
  <link rel="canonical" href="https://acars.pub/" />

  <!-- Link previews (Open Graph / Twitter). Image: public/og.png, 1200×630,
       regenerated with `node scripts/render-og-image.mjs`. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ACARS" />
  <meta property="og:url" content="https://acars.pub/" />
  <meta property="og:title" content="ACARS — Run a real airline on the real clock" />
  <meta property="og:description"
    content="Real routes, real flight times, rival airlines on a live world map. Your airline keeps flying while you're away. Free, no ads, no pay-to-win." />
  <meta property="og:image" content="https://acars.pub/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="ACARS: a live route network on a dark globe, with the tagline 'Run a real airline on the real clock'." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ACARS — Run a real airline on the real clock" />
  <meta name="twitter:description"
    content="Real routes, real flight times, rival airlines on a live world map. Free, no ads, no pay-to-win." />
  <meta name="twitter:image" content="https://acars.pub/og.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>

</html>
