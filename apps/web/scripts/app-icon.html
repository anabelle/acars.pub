<!doctype html>
<!--
  App icon (S34), rendered to public/icons/ by scripts/render-app-icons.mjs.
  ?size=N&variant=tile|maskable. "tile" is a rounded square (any purpose);
  "maskable" fills the square and keeps the glyph inside the 80% safe zone.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; }
  #icon { display: block; }
</style>
</head>
<body>
<svg id="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f" />
      <stop offset="100%" stop-color="#1a1a2e" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#e94560" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect id="plate" width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="url(#glow)" id="plate-glow" />
  <g id="glyph" transform="translate(256 256) scale(1) translate(-256 -256)">
    <circle cx="256" cy="256" r="168" fill="none" stroke="#e94560" stroke-width="10" opacity="0.55" />
    <path d="M150 316 L256 132 L362 316 L256 278 Z" fill="#e94560" />
    <path d="M206 330 L256 280 L306 330" stroke="#f8f8f8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
<script>
  const params = new URLSearchParams(location.search);
  const size = Number(params.get("size") || 512);
  const maskable = params.get("variant") === "maskable";
  const svg = document.getElementById("icon");
  svg.setAttribute("width", size);
  svg.setAttribute("height", size);
  if (maskable) {
    // Full bleed: no rounded corners; glyph shrunk into the 80% safe circle.
    for (const id of ["plate", "plate-glow"]) document.getElementById(id).setAttribute("rx", "0");
    document.getElementById("glyph").setAttribute("transform", "translate(256 256) scale(0.78) translate(-256 -256)");
  }
</script>
</body>
</html>
