# Nostr Relay — nostr.acars.pub
# Include this server block in the main nginx config.
#
# Prerequisites:
#   - SSL cert at /etc/letsencrypt/live/nostr.acars.pub/
#   - strfry-relay container on the same Docker network
#   - WebSocket upgrade map defined in main config:
#       map $http_upgrade $connection_upgrade {
#           default upgrade;
#           ''      close;
#       }
#   - Rate-limit zones defined at the http level of the main config:
#       limit_req_zone $binary_remote_addr zone=relay-writes:10m rate=10r/s;
#       limit_conn_zone $binary_remote_addr zone=relay-writes-conn:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name nostr.acars.pub;

    ssl_certificate /etc/letsencrypt/live/nostr.acars.pub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nostr.acars.pub/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Relay stats endpoint (updated every minute by cron)
    location = /stats {
        alias /var/www/relay/stats.json;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        # HTTP-level rate limit (handshakes, NIP-11 fetches, non-ws abuse).
        # NOTE: nginx cannot rate-limit WebSocket frames — Nostr EVENT writes
        # arrive as ws frames after the upgrade and pass through untouched.
        # Per-connection EVENT limits must live in the strfry write-policy
        # plugin (see write-policy.sh).
        # TODO: enforce per-pubkey EVENT rate limits in the strfry plugin.
        limit_req zone=relay-writes burst=50 nodelay;
        limit_conn relay-writes-conn 64;

        set $relay_upstream http://strfry-relay:7777;
        proxy_pass $relay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket connections are long-lived — 24h timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
