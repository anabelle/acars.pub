name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck Pages Functions
        run: pnpm run typecheck:functions

      - name: Tests (coverage enforced)
        run: pnpm run test:coverage

      # NOTE: this step is expected to FAIL until the dependency updates in
      # the current fix wave land (known high-severity advisories in prod
      # deps as of 2026-09). It is added now so the gate exists; do not
      # remove it to get a green build — update the deps instead.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
