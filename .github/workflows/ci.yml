name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck Pages Functions
        run: pnpm run typecheck:functions

      - name: Tests (coverage enforced)
        run: pnpm run test:coverage

      # NOTE: this step is expected to FAIL until the dependency updates in
      # the current fix wave land (known high-severity advisories in prod
      # deps as of 2026-09). It is added now so the gate exists; do not
      # remove it to get a green build — update the deps instead.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  e2e:
    # Browser smoke tests against the built app (overhaul S01): catches a blank
    # map, boot crashes, missing bundle/worker files and layout regressions.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm --filter @acars/web exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm run test:e2e

      - name: Capture screenshots (390 and 1440)
        if: always()
        run: pnpm run screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/web/.artifacts/screenshots
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
