version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Minor and patch updates come grouped (one dev PR, one prod PR); each
    # major update comes alone, so a migration (TypeScript, Tailwind, Vite…)
    # is its own reviewable PR instead of blocking the routine bumps.
    groups:
      dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-deps:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    # Blocked until a dedicated migration/investigation PR lands (S81 triage,
    # 2026-10-15). Remove the matching line when that work merges.
    ignore:
      # #214: v4 moved the PostCSS plugin to @tailwindcss/postcss; the build
      # fails until the postcss config is migrated.
      - dependency-name: tailwindcss
        versions: [">= 4.0.0"]
      # #207: jsdom 30 floods vitest with 179 unhandled
      # "Cannot read properties of undefined (reading 'bind')" errors.
      - dependency-name: jsdom
        versions: [">= 29.0.0"]
      # #208: 0.5 makes react-refresh/only-export-components a hard error on
      # 5 existing files; needs a code pass to split those exports out.
      - dependency-name: eslint-plugin-react-refresh
        versions: [">= 0.5.0"]
